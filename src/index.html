<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RL Viewer</title>

    <meta name="author" content="Joud Cazeaux" />
    <meta name="description" content="Discover my website and explore my journey as a 3D artist and developer, showcasing creative visuals, technical projects, and immersive experiences I've built" />
    
    <link rel="canonical" href="https://joudcazeaux.fr/" />

    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <meta property="og:title" content="Joud Cazeaux - Developer & 3D Artist" />
    <meta property="og:description" content="Discover my website and explore my journey as a 3D artist and developer, showcasing creative visuals, technical projects, and immersive experiences I've built" />
    <meta property="og:image" content="https://joudcazeaux.fr/images/ProfileImage.webp" />
    <meta property="og:url" content="https://joudcazeaux.fr" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Joud Cazeaux - Developer & 3D Artist">
    <meta name="twitter:description" content="Discover my website and explore my journey as a 3D artist and developer, showcasing creative visuals, technical projects, and immersive experiences I've built">
    <meta name="twitter:image" content="https://joudcazeaux.fr/images/ProfileImage.webp">
    
    <script type="application/ld+json">
        {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Joud Cazeaux",
        "url": "https://joudcazeaux.fr/",
        "sameAs": [
            "https://www.linkedin.com/in/joudcazeaux/",
            "https://github.com/Joucaz",
            "https://x.com/JoucazJC"
        ],
        "jobTitle": "Developer & 3D Artist",
        "description": "Discover my website and explore my journey as a 3D artist and developer, showcasing creative visuals, technical projects, and immersive experiences I've built"
        }
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LF1Q1C32RX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-LF1Q1C32RX');
    </script>
</head>
<body>

    <!-- CANVAS -->
    <canvas class="webgl"></canvas>

    <div class="background-gradient"></div>

    <!-- LOADER -->
    <div id="loader" style="display: none;">
        <div class="loader-bg">
            <!-- <div class="loader-title">Joud Cazeaux</div> -->

            <div class="loader-disappear">
            
                <div class="loader-text">Creating beautiful 3D experience...</div>

                <div class="loader-bar">
                    <div class="loader-bar-fill"></div>
                </div>

                <div id="loader-percent">00.00 %</div>

            </div>
            
            
        </div>

        <div class="button-sound">
            <div class="sound-alert">This experience use sound</div>
            <button class="button-enter">Enter my 3D world</button>
        </div>
        

        <div class="loader-end">
            <span class="span-by">by</span> 
            <span class="span-jc"> Joud Cazeaux</span>
        </div>
    </div>

    <!-- NOUVELLE UI -->
    <div class="customization-ui">
        <!-- Barre verticale de catégories -->
        <div class="category-bar">
            <div class="category-item" data-category="car">
                <img src="images/thumbnails/car/FennecThumbnail.png" alt="Fennec" class="category-thumbnail">
                <span class="category-name">Fennec</span>
            </div>
            
            <div class="category-item" data-category="texture">
                <span>Texture</span>
            </div>

            <div class="category-item" data-category="finish">
                <span>Finish</span>
            </div>
            
            <div class="category-item" data-category="paint">
                <div class="category-color-preview" style="background: #171617;"></div>
                <span class="category-name">Paint</span>
            </div>
            
            <div class="category-item" data-category="wheels">
                <img src="images/thumbnails/wheels/DieciThumbnail.png" alt="Dieci" class="category-thumbnail">
                <span class="category-name">Dieci</span>
            </div>
            
            <div class="category-item" data-category="wheels-paint">
                <div class="category-color-preview" style="background: #1c1c1c;"></div>
                <span class="category-name">Wheels Paint</span>
            </div>

            <div class="category-item">
                <span>Animate Car</span>
            </div>

            <div class="category-item">
                <span>Screenshot</span>
            </div>

            <div class="category-item" data-category="settings">
                <span>Settings</span>
            </div>

        </div>

        <!-- Panneau de sélection -->
        <div class="selection-panel" id="selection-panel">
            <div class="panel-content active" data-panel="car">
                <div class="options-list">
                    <div class="option-item active" id="btn-fennec" data-car="fennec">
                        <img src="images/thumbnails/car/FennecThumbnail.png" alt="Fennec" class="option-image">
                        <span class="option-name">Fennec</span>
                        <div class="check-icon">✓</div>
                    </div>
                    <div class="option-item" id="btn-octane" data-car="octane">
                        <img src="images/thumbnails/car/OctaneThumbnail.png" alt="Octane" class="option-image">
                        <span class="option-name">Octane</span>
                        <div class="check-icon">✓</div>
                    </div>
                    <div class="option-item" id="btn-dominus" data-car="dominus">
                        <img src="images/thumbnails/car/DominusThumbnail.png" alt="Dominus" class="option-image">
                        <span class="option-name">Dominus</span>
                        <div class="check-icon">✓</div>
                    </div>
                </div>
            </div>

             <!-- Contenu PAINT -->
            <div class="panel-content" data-panel="paint">
                <h3>Paint Colors</h3>
                <div class="paint-container">
                    <div class="preset-colors">
                        <div class="color-option active" style="background: #171617;" data-color="#171617"></div>
                        <div class="color-option" style="background: #e3b405;" data-color="#e3b405"></div>
                        <div class="color-option" style="background: #ff6b6b;" data-color="#ff6b6b"></div>
                        <div class="color-option" style="background: #4ecdc4;" data-color="#4ecdc4"></div>
                        <div class="color-option" style="background: #ffffff;" data-color="#ffffff"></div>
                        <div class="color-option" style="background: #9b59b6;" data-color="#9b59b6"></div>
                        <div class="color-option" style="background: #9b59b6;" data-color="#9b59b6"></div>
                        <div class="color-option" style="background: #9b59b6;" data-color="#9b59b6"></div>
                        <div class="color-option" style="background: #9b59b6;" data-color="#9b59b6"></div>
                    </div>
                    <div class="color-picker-wrapper">
                        <label for="paint-color-picker" class="color-picker-label">Custom Color</label>
                        <input type="color" id="paint-color-picker" value="#171617">
                    </div>
                </div>
            </div>

            <!-- Contenu FINISH -->
            <div class="panel-content" data-panel="finish">
                <h3>Paint Finish</h3>
                <div class="dropdown-container">
                    <select id="finish-select" class="finish-dropdown">
                        <option value="anodized" selected>Anodized</option>
                        <option value="matte">Matte</option>
                        <option value="metallic">Metallic</option>
                        <option value="glossy">Glossy</option>
                    </select>
                </div>
            </div>

            

            <!-- Contenu TEXTURE -->
            <div class="panel-content" data-panel="texture">
                <h3>Custom Texture</h3>
                <div class="texture-options">
                    <label for="texture-upload" class="upload-card" id="upload-card">
                        <div class="upload-preview" id="texture-preview" style="display: none;">
                            <img src="" alt="Texture preview" id="texture-preview-img">
                        </div>
                        <div class="upload-content" id="upload-content">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            <span>Upload Texture</span>
                            <small>PNG or JPG • Max 5MB</small>
                        </div>
                    </label>
                    <input type="file" id="texture-upload" accept="image/png,image/jpg,image/jpeg" style="display: none;">
                    
                    <button id="reset-texture" class="reset-card" style="display: none;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                        </svg>
                        <span>Reset to Default</span>
                    </button>
                </div>
            </div>

            <!-- Contenu WHEELS -->
            <div class="panel-content" data-panel="wheels">
                <div class="options-list">
                    <div class="option-item" id="btn-alpha" data-wheel="alpha">
                        <img src="images/thumbnails/wheels/AlphaThumbnail.png" alt="Alpha" class="option-image">
                        <span class="option-name">Alpha</span>
                        <div class="check-icon">✓</div>
                    </div>
                    <div class="option-item" id="btn-cristiano" data-wheel="cristiano">
                        <img src="images/thumbnails/wheels/CristianoThumbnail.png" alt="Cristiano" class="option-image">
                        <span class="option-name">Cristiano</span>
                        <div class="check-icon">✓</div>
                    </div>
                    <div class="option-item active" id="btn-dieci" data-wheel="dieci">
                        <img src="images/thumbnails/wheels/DieciThumbnail.png" alt="Dieci" class="option-image">
                        <span class="option-name">Dieci</span>
                        <div class="check-icon">✓</div>
                    </div>
                </div>
            </div>

            <!-- Contenu WHEELS PAINT -->
            <div class="panel-content" data-panel="wheels-paint">
                <h3>Wheels Paint</h3>
                <div class="paint-container">
                    <div class="preset-colors">
                        <div class="color-option active" style="background: #1c1c1c;" data-wheel-color="#1c1c1c"></div>
                        <div class="color-option" style="background: #e3b405;" data-wheel-color="#e3b405"></div>
                        <div class="color-option" style="background: #ff6b6b;" data-wheel-color="#ff6b6b"></div>
                        <div class="color-option" style="background: #4ecdc4;" data-wheel-color="#4ecdc4"></div>
                        <div class="color-option" style="background: #ffffff;" data-wheel-color="#ffffff"></div>
                        <div class="color-option" style="background: #9b59b6;" data-wheel-color="#9b59b6"></div>
                        <div class="color-option" style="background: #4ecdc4;" data-wheel-color="#4ecdc4"></div>
                        <div class="color-option" style="background: #ffffff;" data-wheel-color="#ffffff"></div>
                        <div class="color-option" style="background: #9b59b6;" data-wheel-color="#9b59b6"></div>
                    </div>
                    <div class="color-picker-wrapper">
                        <label for="wheel-color-picker" class="color-picker-label">Custom Color</label>
                        <input type="color" id="wheel-color-picker" value="#1c1c1c">
                    </div>
                </div>
            </div>

            <div class="panel-content" data-panel="settings">
                <h3>Settings</h3>
                <div class="settings-container">
                    <!-- Mute Music -->
                    <div class="setting-item">
                        <label class="setting-label">
                            <span>Music</span>
                            <input type="checkbox" id="music-toggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <!-- Auto Rotation -->
                    <div class="setting-item">
                        <label class="setting-label">
                            <span>Auto Rotation</span>
                            <input type="checkbox" id="rotation-toggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <!-- Rotation Speed -->
                    <div class="setting-item">
                        <label class="setting-label-range">
                            <span>Rotation Speed</span>
                            <input type="range" id="rotation-speed" min="0" max="2" step="0.1" value="1">
                            <span class="range-value" id="rotation-speed-value">1.0</span>
                        </label>
                    </div>

                    <!-- Light Intensity -->
                    <div class="setting-item">
                        <label class="setting-label-range">
                            <span>Light Intensity</span>
                            <input type="range" id="light-intensity" min="0" max="20" step="0.5" value="10">
                            <span class="range-value" id="light-intensity-value">10</span>
                        </label>
                    </div>

                    <!-- Environment Intensity -->
                    <div class="setting-item">
                        <label class="setting-label-range">
                            <span>Environment</span>
                            <input type="range" id="env-intensity" min="0" max="2" step="0.1" value="0.4">
                            <span class="range-value" id="env-intensity-value">0.4</span>
                        </label>
                    </div>
                </div>
            </div>

            
        </div>
    </div>
    
    <script type="module" src="./script.js"></script>

</body>
</html>
