<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rocket League Viewer</title>

    <meta name="author" content="Joud Cazeaux" />
    <meta name="description" content="View and customize Rocket League cars in an interactive 3D experience. Visualize decals, custom paints, finishes, and wheels on Fennec, Octane, and Dominus. Export BakkesMod codes instantly." />
    <link rel="canonical" href="https://rlviewer.joudcazeaux.fr/" />

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./style-mobile.css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <meta property="og:title" content="Rocket League Viewer" />
    <meta property="og:description" content="View and customize Rocket League cars in an interactive 3D experience. Visualize decals, custom paints, finishes, and wheels on Fennec, Octane, and Dominus. Export BakkesMod codes instantly." />
    <meta property="og:image" content="https://rlviewer.joudcazeaux.fr/images/RLViewerImageCard.png" />
    <meta property="og:url" content="https://rlviewer.joudcazeaux.fr" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Rocket League Viewer">
    <meta name="twitter:description" content="View and customize Rocket League cars in an interactive 3D experience. Visualize decals, custom paints, finishes, and wheels on Fennec, Octane, and Dominus. Export BakkesMod codes instantly.">
    <meta name="twitter:image" content="https://rlviewer.joudcazeaux.fr/images/RLViewerImageCard.png">

    <script type="application/ld+json">
        {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Rocket League Viewer",
        "url": "https://rlviewer.joudcazeaux.fr",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "description": "View and customize Rocket League cars in an interactive 3D experience. Visualize decals, custom paints, finishes, and wheels on Fennec, Octane, and Dominus. Export BakkesMod codes instantly.",
        "author": {
            "@type": "Person",
            "name": "Joud Cazeaux",
            "url": "https://joudcazeaux.fr/",
            "sameAs": [
            "https://www.linkedin.com/in/joudcazeaux/",
            "https://github.com/Joucaz",
            "https://x.com/JoucazJC"
            ],
            "jobTitle": "Developer & 3D Artist"
        }
        }
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TC7H0V8YR5"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-TC7H0V8YR5');
    </script>
</head>
<body>

    <!-- CANVAS -->
    <canvas class="webgl"></canvas>

    <div class="background-gradient"></div>

    
   <!-- LOADER -->
    <div id="loader">
        <div class="loader-bg">
            <!-- Animation de la voiture -->
            

            <div class="loader-disappear">
                <div class="car-animation">
                    <div class="car-orbit">
                        <img src="images/car-loader.png" alt="Loading" class="car-loader-img">
                    </div>
                </div>
                <!-- <div class="loader-text">Creating beautiful 3D experience...</div> -->

                <div class="loader-bar">
                    <div class="loader-bar-fill"></div>
                </div>

                <div id="loader-percent">00.00 %</div>
            </div>
            
            <!-- BOUTON COMMENTÉ
            <div class="button-sound">
                <div class="sound-alert">This experience use sound</div>
                <button class="button-enter">Enter my 3D world</button>
            </div>
            -->
        </div>

        <div class="loader-end">
            <span class="span-by">by</span> 
            <span class="span-jc"> Joud Cazeaux</span>
        </div>
    </div>
   

    <!-- NOUVELLE UI -->
    <div class="customization-ui">
        <!-- Barre verticale de catégories -->
        <div class="category-bar">
            <div class="category-item" data-category="car">
                <img src="images/thumbnails/car/OctaneThumbnail.png" alt="Octane" class="category-thumbnail">
                <!-- <span class="category-name">Fennec</span> -->
            </div>
            
            <div class="category-item" data-category="texture">
                <span>Texture</span>
            </div>

            <div class="category-item" data-category="finish">
                <span>Finish</span>
            </div>
            
            <div class="category-item" data-category="paint">
                <span class="category-name">Paint</span>
                <div class="category-color-preview" style="background: #171617;"></div>
            </div>
            
            <div class="category-item" data-category="wheels">
                <img src="images/thumbnails/wheels/DieciThumbnail.png" alt="Dieci" class="category-thumbnail">
                <!-- <span class="category-name">Dieci</span> -->
            </div>
            
            <div class="category-item" data-category="wheels-paint">
                <span class="category-name">Wheels Paint</span>
                <div class="category-color-preview" style="background: #171617;"></div>
            </div>

            <div class="category-item" data-category="rendering">
                <span>Export</span>
            </div>

            <!-- <div class="category-item">
                <span>Animate Car</span>
            </div>

            <div class="category-item">
                <span>Screenshot</span>
            </div> -->
            
            <div class="category-item" data-category="settings">
                <span>Settings</span>
            </div>

        </div>

        

        <!-- Panneau de sélection -->
        <div class="selection-panel" id="selection-panel">
            <div class="panel-content active" data-panel="car">
                <div class="options-list">
                    <div class="option-item" id="btn-fennec" data-car="fennec">
                        <img src="images/thumbnails/car/FennecThumbnail.png" alt="Fennec" class="option-image">
                        <span class="option-name">Fennec</span>
                        <div class="check-icon">✓</div>
                    </div>
                    <div class="option-item active" id="btn-octane" data-car="octane">
                        <img src="images/thumbnails/car/OctaneThumbnail.png" alt="Octane" class="option-image">
                        <span class="option-name">Octane</span>
                        <div class="check-icon">✓</div>
                    </div>
                    <div class="option-item" id="btn-dominus" data-car="dominus">
                        <img src="images/thumbnails/car/DominusThumbnail.png" alt="Dominus" class="option-image">
                        <span class="option-name">Dominus</span>
                        <div class="check-icon">✓</div>
                    </div>
                </div>
            </div>

             <!-- Contenu PAINT -->
            <div class="panel-content" data-panel="paint">
                <div class="paint-container">
                    <div class="preset-colors">
                        <div class="color-option active" style="background: #171617;" data-color="#171617"></div>
                        <div class="color-option" style="background: #67655f;" data-color="#67655f"></div>
                        <div class="color-option" style="background: #fffff0;" data-color="#fffff0"></div>
                        <div class="color-option" style="background: #47d9e0;" data-color="#47d9e0"></div>
                        <div class="color-option" style="background: #cdf032;" data-color="#cdf032"></div>
                        <div class="color-option" style="background: #de2823;" data-color="#de2823"></div>
                        <div class="color-option" style="background: #ff7300;" data-color="#ff7300"></div>
                        <div class="color-option" style="background: #ff5cb6;" data-color="#ff5cb6"></div>
                        <div class="color-option" style="background: #3b083f;" data-color="#3b083f"></div>
                    </div>
                    <div class="color-picker-wrapper">
                        <label for="paint-color-picker" class="color-picker-label">Choose Color</label>
                        <input type="color" id="paint-color-picker" value="#171617">
                    </div>
                </div>
            </div>

            <!-- Contenu FINISH -->
            <div class="panel-content" data-panel="finish">
                <!-- <h3>Paint Finish</h3> -->
                <div class="dropdown-container">
                    <select id="finish-select" class="finish-dropdown">
                        <option value="anodized" selected>Anodized</option>
                        <option value="matte">Matte</option>
                        <option value="metallic">Metallic</option>
                        <option value="glossy">Glossy</option>
                    </select>
                </div>
            </div>

            

            <!-- Contenu TEXTURE -->
            <div class="panel-content" data-panel="texture">
                <!-- <h3>Custom Texture</h3> -->
                <div class="texture-options">
                    <!-- 🆕 Galerie de textures prédéfinies -->
                    <div class="preset-textures" id="preset-textures-gallery">
                        <!-- Les textures seront injectées dynamiquement par JS -->
                    </div>

                    <label for="texture-upload" class="upload-card" id="upload-card">
                        <div class="upload-preview" id="texture-preview" style="display: none;">
                            <img src="" alt="Texture preview" id="texture-preview-img">
                        </div>
                        <div class="upload-content" id="upload-content">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            <span>Upload Texture</span>
                            <small>PNG or JPG • Max 5MB</small>
                        </div>
                    </label>
                    <input type="file" id="texture-upload" accept="image/png,image/jpg,image/jpeg" style="display: none;">
                    
                    <button id="reset-texture" class="reset-card" style="display: none;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                        </svg>
                        <span>Reset to Default</span>
                    </button>
                </div>
            </div>

            <!-- Contenu WHEELS -->
            <div class="panel-content" data-panel="wheels">
                <div class="options-list">
                    <div class="option-item" id="btn-alpha" data-wheel="alpha">
                        <img src="images/thumbnails/wheels/AlphaThumbnail.png" alt="Alpha" class="option-image">
                        <span class="option-name">Alpha</span>
                        <div class="check-icon">✓</div>
                    </div>
                    <div class="option-item" id="btn-cristiano" data-wheel="cristiano">
                        <img src="images/thumbnails/wheels/CristianoThumbnail.png" alt="Cristiano" class="option-image">
                        <span class="option-name">Cristiano</span>
                        <div class="check-icon">✓</div>
                    </div>
                    <div class="option-item active" id="btn-dieci" data-wheel="dieci">
                        <img src="images/thumbnails/wheels/DieciThumbnail.png" alt="Dieci" class="option-image">
                        <span class="option-name">Dieci</span>
                        <div class="check-icon">✓</div>
                    </div>
                    <div class="option-item" id="btn-urus" data-wheel="urus">
                        <img src="images/thumbnails/wheels/UrusThumbnail.png" alt="Urus" class="option-image">
                        <span class="option-name">Urus</span>
                        <div class="check-icon">✓</div>
                    </div>
                    <div class="option-item" id="btn-skyline" data-wheel="skyline">
                        <img src="images/thumbnails/wheels/SkylineThumbnail.png" alt="Skyline" class="option-image">
                        <span class="option-name">Skyline</span>
                        <div class="check-icon">✓</div>
                    </div>
                </div>
            </div>

            <!-- Contenu WHEELS PAINT -->
            <div class="panel-content" data-panel="wheels-paint">
                <div class="paint-container">
                    <div class="preset-colors">
                        <div class="color-option active" style="background: #171617;" data-wheel-color="#171617"></div>
                        <div class="color-option" style="background: #67655f;" data-wheel-color="#67655f"></div>
                        <div class="color-option" style="background: #fffff0;" data-wheel-color="#fffff0"></div>
                        <div class="color-option" style="background: #47d9e0;" data-wheel-color="#47d9e0"></div>
                        <div class="color-option" style="background: #cdf032;" data-wheel-color="#cdf032"></div>
                        <div class="color-option" style="background: #de2823;" data-wheel-color="#de2823"></div>
                        <div class="color-option" style="background: #ff7300;" data-wheel-color="#ff7300"></div>
                        <div class="color-option" style="background: #ff5cb6;" data-wheel-color="#ff5cb6"></div>
                        <div class="color-option" style="background: #3b083f;" data-wheel-color="#3b083f"></div>
                    </div>
                    <div class="color-picker-wrapper">
                        <label for="wheel-color-picker" class="color-picker-label">Choose Color</label>
                        <input type="color" id="wheel-color-picker" value="#171617">
                    </div>
                </div>
            </div>

            <div class="panel-content" data-panel="rendering">
                <div class="settings-container">
                    <!-- Play Animation Button -->
                    <div class="setting-item action-button" id="play-animation-btn">
                        <div class="action-content">
                            <span>Play Animation</span>
                        </div>
                    </div>

                    <!-- Save Animation Button -->
                    <div class="setting-item action-button" id="save-animation-btn">
                        <div class="action-content">
                            <span id="save-animation-text">Save Animation</span>
                        </div>
                    </div>

                    <!-- Save Image Button -->
                    <div class="setting-item action-button" id="save-image-btn">
                        <div class="action-content">
                            <span>Save Image</span>
                        </div>
                    </div>

                    <!-- 🆕 BakkesMod Code Button -->
                    <div class="setting-item action-button" id="bakkesmod-btn">
                        <div class="action-content">
                            <span>Generate BakkesMod Code</span>
                        </div>
                    </div>

                    <!-- 🆕 BakkesMod Code Display -->
                    <div class="bakkesmod-result" id="bakkesmod-result" style="display: none;">
                        <div class="bakkesmod-code-container">
                            <input type="text" id="bakkesmod-code" readonly>
                            <button id="copy-code-btn" title="Copy to clipboard">📋</button>
                        </div>
                        <small>Paste this code in BakkesMod</small>
                    </div>
                </div>
            </div>

            <div class="panel-content" data-panel="settings">
                <!-- <h3>Settings</h3> -->
                <div class="settings-container">
                    <!-- Mute Music -->
                    <div class="setting-item">
                        <label class="setting-label">
                            <span>Music</span>
                            <input type="checkbox" id="music-toggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <!-- Auto Rotation -->
                    <div class="setting-item">
                        <label class="setting-label">
                            <span>Auto Rotate</span>
                            <input type="checkbox" id="rotation-toggle" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <!-- Rotation Speed -->
                    <div class="setting-item">
                        <label class="setting-label-range">
                            <span>Rotation Speed</span>
                            <input type="range" id="rotation-speed" min="0" max="2" step="0.1" value="0.5">
                            <span class="range-value" id="rotation-speed-value">0.5</span>
                        </label>
                    </div>

                    <!-- Light Intensity (Multiplicateur global) -->
                    <div class="setting-item">
                        <label class="setting-label-range">
                            <span>Light Intensity</span>
                            <input type="range" id="light-intensity" min="0" max="3" step="0.1" value="1">
                            <span class="range-value" id="light-intensity-value">1.0</span>
                        </label>
                    </div>

                    <!-- Environment Intensity -->
                    <div class="setting-item">
                        <label class="setting-label-range">
                            <span>Environment</span>
                            <input type="range" id="env-intensity" min="0" max="2" step="0.1" value="0.4">
                            <span class="range-value" id="env-intensity-value">0.4</span>
                        </label>
                    </div>
                </div>
            </div>

            
        </div>
    </div>

    <!-- Footer "by Joud Cazeaux" -->
    
    <div class="ui-footer">
        
        <span class="ui-footer-by">by</span>
        <a href="https://joudcazeaux.fr" target="_blank">
            <img src="images/LogoBlanc.png" alt="Fennec" class="ui-footer-image">
        </a><!-- <span class="ui-footer-name">Joud Cazeaux</span> -->
    </div>  
    
    <script type="module" src="./script.js"></script>

</body>
</html>
